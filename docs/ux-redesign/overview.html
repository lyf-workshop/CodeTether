<!doctype html>
<html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><title>CodeTether 重设计 v2 · 截图总览</title>
<link rel="stylesheet" href="prototype/tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ct-bg); color: var(--ct-text); font: 400 14px/1.55 var(--ct-font); }
  header { display: flex; align-items: center; gap: 16px; padding: 32px 40px 8px; }
  .mark { width: 40px; height: 40px; border-radius: 11px; background: var(--ct-ink); color: var(--ct-on-ink); display: grid; place-items: center; flex: none; }
  .mark svg { width: 24px; height: 24px; }
  h1 { margin: 0; font: 600 24px/1.3 var(--ct-display); letter-spacing: -.01em; }
  header p { margin: 2px 0 0; color: var(--ct-text-2); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 40px 0; }
  .chip { font-size: 12.5px; color: var(--ct-text-2); background: var(--ct-surface); border: 1px solid var(--ct-line); border-radius: 999px; padding: 3px 12px; }
  .chip.warn { color: var(--ct-warn-text); background: var(--ct-warn-soft); border-color: transparent; }
  .chip.dash { border-style: dashed; border-color: var(--ct-line-strong); }
  section { padding: 0 40px; }
  h2 { display: flex; align-items: baseline; gap: 10px; margin: 36px 0 14px; font: 600 16px/1.3 var(--ct-display); }
  h2 small { font: 400 12.5px var(--ct-font); color: var(--ct-text-3); }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
  .grid.phone { grid-template-columns: repeat(8, minmax(0, 1fr)); margin-top: 16px; }
  a { display: block; color: inherit; text-decoration: none; background: var(--ct-surface); border: 1px solid var(--ct-line); border-radius: 10px; overflow: hidden; box-shadow: var(--ct-shadow-1); }
  a:hover, a:focus-visible { border-color: var(--ct-accent); outline: none; }
  img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; background: var(--ct-inset); border-bottom: 1px solid var(--ct-line); }
  .grid.phone img { aspect-ratio: 390 / 844; }
  a b { display: block; padding: 8px 10px 0; font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  a span { display: block; padding: 0 10px 8px; font: 11px/1.6 var(--ct-mono); color: var(--ct-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid.phone a b, .grid.phone a span { white-space: normal; overflow-wrap: anywhere; }
  footer { padding: 36px 40px 40px; color: var(--ct-text-3); font-size: 12.5px; }
  code { font-family: var(--ct-mono); font-size: 12px; }
</style></head>
