name: CodeTether
options:
  bundleIdPrefix: org.codetether
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "27.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
targets:
  CodeTether:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/CodeTether
      - path: Generated/Bindings
        optional: true
    resources:
      - path: Assets.xcassets
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.codetether.app
        PRODUCT_NAME: CodeTether
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_CFBundleDisplayName: CodeTether
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "YES"
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    dependencies:
      - framework: Frameworks/SupervisorMobile.xcframework
        embed: false
  CodeTetherTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/CodeTetherTests
    dependencies:
      - target: CodeTether
      - framework: Frameworks/SupervisorMobile.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.codetether.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: "NO"
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "YES"
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
  CodeTetherUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/CodeTetherUITests
    dependencies:
      - target: CodeTether
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.codetether.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: "NO"
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "YES"
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
schemes:
  CodeTether:
    build:
      targets:
        CodeTether: all
        CodeTetherTests: [test]
        CodeTetherUITests: [test]
    test:
      config: Debug
      targets:
        - CodeTetherTests
        - CodeTetherUITests
      gatherCoverageData: false
