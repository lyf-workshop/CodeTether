<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- CodeTether app icon, full-bleed master for Windows and PNG sizes 48 px and up.
       A kite on a string: the AI tool works far away, the string stays in your hand. -->
