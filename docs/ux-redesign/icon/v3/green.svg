<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- CodeTether app icon, full-bleed master for Windows and PNG sizes 48 px and up.
       Two stacked device cards: the front one runs the AI tool (prompt and cursor),
       the frosted one behind is your other device. Apple-style light-from-top gradient. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fe39a"/>
      <stop offset="1" stop-color="#16b46a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25c47a"/>
      <stop offset="1" stop-color="#0e9658"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#0b4d2c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#sheen)"/>
  <rect x="304" y="236" width="480" height="380" rx="72" fill="#ffffff" fill-opacity="0.32"/>
  <g filter="url(#shadow)">
    <rect x="224" y="356" width="500" height="404" rx="80" fill="url(#card)"/>
  </g>
  <polyline points="334,478 434,558 334,638" fill="none" stroke="url(#ink)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="484" y1="638" x2="604" y2="638" stroke="url(#ink)" stroke-width="56" stroke-linecap="round"/>
</svg>
