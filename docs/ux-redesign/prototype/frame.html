<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Device frame</title>
<style>html,body{margin:0;background:#000;overflow:hidden}iframe{border:0;display:block}</style></head>
<body><script>
  // frame.html?w=390&h=844&theme=dark#/route — 以指定视口宽度渲染 index.html，其余参数原样转发。
  const p = new URLSearchParams(location.search);
  const f = document.createElement('iframe');
  f.width = p.get('w') || 390; f.height = p.get('h') || 844;
  p.delete('w'); p.delete('h');
  f.src = 'index.html?' + p.toString() + location.hash;
  document.body.appendChild(f);
</script></body></html>
