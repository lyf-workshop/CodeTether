<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS master: 824 px body on the 1024 grid, transparent margin with the soft drop shadow of Apple's template -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66a8ff"/>
      <stop offset="1" stop-color="#4b55e8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#5a46e6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#1c2470" flood-opacity="0.35"/>
    </filter>
    <filter id="body-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g transform="translate(100 100) scale(0.8046875)">
    <rect width="1024" height="1024" rx="230" fill="url(#bg)" filter="url(#body-shadow)"/>
    <rect width="1024" height="1024" rx="230" fill="url(#sheen)"/>
    <rect x="304" y="236" width="480" height="380" rx="72" fill="#ffffff" fill-opacity="0.32"/>
    <g filter="url(#shadow)">
      <rect x="224" y="356" width="500" height="404" rx="80" fill="url(#card)"/>
    </g>
    <polyline points="334,478 434,558 334,638" fill="none" stroke="url(#ink)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="484" y1="638" x2="604" y2="638" stroke="url(#ink)" stroke-width="56" stroke-linecap="round"/>
  </g>
</svg>
